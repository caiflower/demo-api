  ## Project Layout

  ```
  {{ .PROJECT_NAME }}/
  ├── build/
  │   ├── docker/
  │   └── k8s/
  ├── constants/          # Global config structs; ALL config additions go here
  │   └── config.go       # DefaultConfig (system) + Prop/Config (business)
  ├── controller/
  │   └── v1/
  │       ├── base/       # Base/example controllers (HelloWorldController)
  │       └── <domain>/   # One file per business domain
  ├── dao/
  │   └── client.go       # DB init + go:generate directive for DAO codegen
  ├── etc/
  │   ├── config.yaml     # Business config (go_max_procs, caller_interval, …)
  │   └── default.yaml    # System config (web, cluster, database, redis, kafka, logger)
  ├── model/
  │   ├── api/
  │   │   ├── base.go           # Shared Request struct (X-Request-Id header)
  │   │   ├── base/             # REST request/response structs for base domain
  │   │   └── <domain>/         # REST + gRPC pb.go files per domain
  │   └── idl/
  │       ├── generate.go       # go:generate directives for protoc
  │       └── <domain>.proto    # Protobuf IDL definitions
  ├── service/
  │   └── caller/               # Cluster / leader-election service
  │       ├── cluster.go        # Init() wires cluster + job tracker
  │       └── default.go        # DefaultCaller implements MasterCall / SlaverCall
  ├── web/
  │   ├── server.go       # Init(): create web.Engine, call register(), add as daemon
  │   └── restful.go      # register(): ALL route definitions live here
  ├── main.go
  ├── go.mod
  └── go.sum
  ```

  ## Architecture Patterns

  ### Startup Order (main.go init())
  1. constants.InitConfig()        — load etc/config.yaml + etc/default.yaml
  2. logger.InitLogger()           — init logger, add to resource manager
  3. initBean()                    — register any manual beans
  4. web.Init()                    — create HTTP engine, register routes, add as daemon
  5. dao.Init()                    — (optional) init DB client, add bean
  6. caller.Init()                 — init cluster, add daemon
  7. bean.Ioc()                    — inject all autowired dependencies
  Then main() calls global.DefaultResourceManger.Signal() for graceful shutdown.

  ### Resource Management
  - Use global.DefaultResourceManger for lifecycle management
  - Daemon services: implement global.DaemonResource (Name(), Start() error, Close())
  - Register via global.DefaultResourceManger.AddDaemon(&Service{})
  - Non-daemon resources: global.DefaultResourceManger.Add(resource)
  - Signal() in main() handles graceful shutdown

  ### Dependency Injection
  - Use github.com/caiflower/common-tools/pkg/bean
  - Mark dependencies with `autowired:""` struct tag
  - Register manual beans with bean.AddBean(obj)
  - Call bean.Ioc() once at the end of init() — after all beans are registered

  ### Configuration
  - etc/default.yaml  → constants.DefaultConfig (type config.DefaultConfig)
    - Sections: web, cluster, database, redis, kafka, logger
    - Load via config.LoadDefaultConfig(&DefaultConfig)
  - etc/config.yaml   → constants.Prop (type constants.Config)
    - Business fields: go_max_procs, caller_interval, and any new domain fields
    - Load via config.LoadYamlFile("config.yaml", &Prop)
  - ALL new config structs and fields go into constants/config.go

  ### Controller Layer
  - One struct per controller, named <Domain>Controller (e.g. HelloWorldController)
  - No embedded base struct; receive concrete request types, return response or e.ApiError
  - Method signatures (choose one pattern):
    - func (c *FooController) Action() ReturnType
    - func (c *FooController) Action(req *model.FooReq) (*model.FooRes, e.ApiError)
  - Use e.NewApiError(e.InvalidArgument, "msg", err) to return errors
  - Do NOT define routes inside controllers; all routing lives in web/restful.go

  ### Route Registration (web/restful.go)
  - All routes registered in register(engine *web.Engine)
  - Group by API version: v1 := controller.NewRestFul().Group("/v1")
  - REST routes: engine.Register(v1.Method(http.MethodXxx).Path("/resource").RegisterMethod(...))
  - gRPC-over-HTTP: engine.RegisterGRPCService(&proto.Xxx_ServiceDesc, &impl{})
                    engine.Register(v1.Method(...).Path(...).RegisterGrpcMethod(...))
  - Path parameters use colon syntax: /resource/:id

  ### Model Layer
  - model/api/base.go: shared Request struct (embed for X-Request-Id header injection)
    type Request struct { RequestId string `header:"X-Request-Id" json:"-"` }
  - model/api/<domain>/: domain request/response structs + generated gRPC pb.go files
  - Struct binding tags:
    - `json:"field"`          — JSON body
    - `header:"Header-Name"`  — HTTP header
    - `path:"param"`          — URL path parameter
    - `query:"param"`         — query string parameter
    - `verf:"required"`       — required field validation
  - Request structs that need X-Request-Id should embed api.Request

  ### gRPC / IDL
  - Define protobuf in model/idl/<domain>.proto
  - model/idl/generate.go holds go:generate directives for protoc
  - Generated files go to model/api/<domain>/  (*.pb.go, *_grpc.pb.go)
  - Controller implements Unimplemented<Service>Server from the generated package
  - Run `go generate ./...` to regenerate all IDL and DAO code

  ### DAO Layer
  - dao/client.go: Init() creates DB client via dbv1.NewDBClient(constants.DefaultConfig.DatabaseConfig[0])
  - DAO structs are generated via go:generate in dao/client.go
  - Register DB client as bean: bean.AddBean(db)
  - Inject into services/controllers with `autowired:""`
  - Call dao.Init() in main.go init() before bean.Ioc()

  ### HTTP Client
  - Use github.com/caiflower/common-tools/web/app/client for external HTTP calls
  - Do NOT use standard library net/http.Client directly in production code

  ### Cluster (Leader Election)
  - Initialize via cluster.NewCluster(constants.DefaultConfig.ClusterConfig)
  - Add job tracker: c.AddJobTracker(cluster.NewDefaultJobTracker(constants.Prop.CallerInterval, &DefaultCaller{}))
  - Register to resource manager: global.DefaultResourceManger.AddDaemon(c)
  - Implement cluster.DefaultCaller interface:
    - MasterCall(): called when this node becomes master
    - SlaverCall(leaderName string): called when this node becomes slave
  - CallerInterval (in Prop, unit: seconds): interval for leader election checks

  ### JSON Serialization 
    - JSON Serialization: Use github.com/caiflower/common-tools/pkg/tools instead of encoding/json
    - Use tools.Marshal(v) instead of json.Marshal(v)
    - Use tools.Unmarshal(bytes, v) instead of json.Unmarshal(bytes, v)
    - Use tools.ToJson(v) for string output, tools.ToByte(v) / tools.DeByte(bytes, v) for flexible conversion
    - Underlying implementation uses jsoniter.ConfigFastest, significantly faster than standard library
    - Do NOT import "encoding/json" in production code
  

  ## Code Organization Rules

  - Keep related functionality in the same file; avoid scattering config across multiple files
  - ALL config structs → constants/config.go (never create separate config files per feature)
  - ALL route definitions → web/restful.go (never register routes inside controllers)
  - New domain controllers → controller/v1/<domain>/<domain>.go
  - New domain models → model/api/<domain>/<domain>.go
  - New domain services → service/<domain>/<domain>.go
  - Before creating a new file, check if an existing file in that package can be extended
  - Only create a new package directory when introducing a fully separate domain or module

  ## Infrastructure Client Rules

  - Redis: MUST use `github.com/caiflower/common-tools/redis/v1`.NewRedisClient(config) to create Redis clients; NEVER use `github.com/go-redis/redis/v8`.NewClient() directly
  - Redis: Get the underlying *redis.Client via type assertion on RedisClient.GetRedis().(*redis.Client) when needed by third-party libraries
  - Redis: Configuration MUST come from `constants.DefaultConfig.RedisConfig[0]` (loaded from etc/default.yaml)
  - Redis: Client lifecycle is managed by common-tools (global.DefaultResourceManger); do NOT manually close
  - DB: MUST use `github.com/caiflower/common-tools/db/v1`.NewDBClient(config) via dao.Init(); NEVER create bun.DB directly
  - ClickHouse: MUST use `github.com/caiflower/common-tools/ck` for ClickHouse client creation and query execution; NEVER use `github.com/ClickHouse/clickhouse-go/v2` directly
  - ClickHouse: Configuration MUST come from `constants.DefaultConfig.ClickhouseConfig` (loaded from etc/default.yaml)
  - ClickHouse: Client lifecycle is managed by common-tools (global.DefaultResourceManger); do NOT manually close
  - Kafka: MUST use `github.com/caiflower/common-tools/kafka` for Kafka client creation and message production/consumption; NEVER use `github.com/IBM/sarama` or `github.com/confluentinc/confluent-kafka-go/kafka` directly
  - Kafka: Configuration MUST come from `constants.DefaultConfig.KafkaConfig` (loaded from etc/default.yaml)
  - Kafka: Client lifecycle is managed by common-tools (global.DefaultResourceManger); do NOT manually close
  - HTTP Client: MUST use `github.com/caiflower/common-tools/web/app/client` for external HTTP calls; NEVER use net/http.Client directly
  - JSON: MUST use `github.com/caiflower/common-tools/pkg/tools`.Marshal/Unmarshal; NEVER use encoding/json in production code
  - Context Keys: Use new-api's `common.SetContextKey/GetContextKeyString` with `constant.ContextKeyXxx` for cross-middleware data passing (e.g. ContextKeyOriginalModel); do NOT invent custom context keys for data already covered by these constants
  - Middleware order: Identity → ExtractModel → RateLimit → (future: Quota) → Handler

